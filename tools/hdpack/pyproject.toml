[project]
name = "plegacy-hdpack"
version = "1.1.0"
description = "Build and check HD art packs for Pizza Legacy"
requires-python = ">=3.10"
dependencies = ["Pillow==13.0.0", "numpy==2.5.3"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "N"]
ignore = ["S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
